# Nöbetçi — Render Blueprint (Go API + AI servis)
services:
  - type: web
    name: nobetci-ai-service
    runtime: docker
    region: frankfurt
    # Üç YOLO modeli + torch ~1.5-2GB RAM ister; free tier (512MB) OOM olur.
    # Gerçek inference için Standard (2GB) önerilir.
    plan: standard
    dockerfilePath: ./ai-service/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: DEMO_MODE
        value: "false"
      - key: ENABLE_SPECIALIST_MODELS
        value: "true"
      - key: DETECT_TIMEOUT_SEC
        value: "30"
      - key: OPENAI_API_KEY
        sync: false

  - type: web
    name: nobetci-backend
    runtime: go
    region: frankfurt
    plan: free
    rootDir: backend
    buildCommand: go build -o bin/api ./cmd/api
    startCommand: ./bin/api
    healthCheckPath: /health
    envVars:
      - key: PORT
        sync: false
      - key: AI_SERVICE_URL
        fromService:
          name: nobetci-ai-service
          type: web
          property: hostport
      # Gerçek AI sonuçları kullanılır. AI servis hata verirse demo rapora
      # düşmek isterseniz "true" yapın (graceful fallback).
      - key: DEMO_MODE
        value: "false"
